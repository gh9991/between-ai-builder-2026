name: Validate and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: work-memory/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: work-memory
      - run: npm run check
        working-directory: work-memory
      - run: npm run build
        working-directory: work-memory
      - run: node --test deploy/server.test.mjs deploy/archive.test.mjs work-memory/scripts/monthly-contributions/report.test.mjs
